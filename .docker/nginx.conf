pid /tmp/nginx.pid;
worker_processes 1;

events {
	worker_connections 1024;
}

http {
	include mime.types;
	default_type application/octet-stream;

	sendfile on;
	keepalive_timeout 65;

	client_body_temp_path /tmp/client_temp;
	proxy_temp_path /tmp/proxy_temp_path;
	fastcgi_temp_path /tmp/fastcgi_temp;
	uwsgi_temp_path /tmp/uwsgi_temp;
	scgi_temp_path /tmp/scgi_temp;

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	server {
		listen 8082;
		listen [::]:8082;
		server_name localhost;
		root /usr/share/nginx/html; # Path to your static files

		# Runtime config generated at container startup
		location = /tableau-de-bord/editeur/env.js {
			alias /tmp/env.js;
			default_type application/javascript;

			# Allow caching but force revalidation on every use.
			add_header Cache-Control "no-cache, must-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires "0" always;
		}

		# Permanent redirect for the home page
		location = /tableau-de-bord/editeur {
			return 301 /tableau-de-bord/editeur/ ;
		}
		server_tokens off;
		
		# Serve static files
		location /tableau-de-bord/editeur/ {
			alias /usr/share/nginx/html/;
			try_files $uri $uri/ /tableau-de-bord/editeur/index.html;
        add_header Cache-Control 'max-age=86400'; # 24h
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()";
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;
		}

    location / {
        try_files $uri $uri/ /index.html;
    }

		# Handle 404 errors
		# 403 is included to prevent directory listing attempts from showing the 404 page
		error_page 403 404 =404 /404.html;
		location = /404.html {
			root /usr/share/nginx/html;
		}
	}
}
