components:
  schemas:
    Article:
      properties:
        id:
          description: 'Identifiant de l''article'
          type: integer
        category:
          description: 'Categorie de l''article'
          type: string
        position:
          description: 'Ordre d''affichage de l''article'
          type: number
        title:
          description: 'Titre de l''article'
          type: string
        content:
          description: 'Contenu de l''article'
          type: string
        tags:
          description: 'Tags de l''article'
          type: array
          items:
            type: string
        updated_at:
          description: 'Date de mise à jour de l''article'
          type: string
          format: date-time
        updated_by:
          description: 'Nom public de l''utilisateur qui a modifié l''article'
          type: string
        img_url:
          description: 'Url de l''image d''illustration de l''article'
          type: string
          format: uri
        link_text:
          description: 'Article de la catégorie news : texte du lien'
          type: string
        link_url:
          description: 'Article de la catégorie news : destination du lien'
          type: string
          format: uri
      type: object
    Bbox:
      description: 'Emprise visible de la carte (Haut, droite, bas, gauche)'
      type: array
      items:
        type: number
      maxItems: 4
      minItems: 4
    Map_add:
      description: Carte
      properties:
        title:
          description: 'Titre de la carte'
          type: string
        description:
          description: 'Description de la carte'
          type: string
          nullable: true
        theme_id:
          description: 'identifiant du theme'
          type: integer
        type:
          description: 'Type de la carte (''macarte'', ''mesadresses'', statistic'', storymap'')'
          type: string
        premium:
          description: 'Premium de la carte (''default'', ''edugeo'')'
          type: string
          default: default
        organization_id:
          description: 'Identifiant public de l''organisation.'
          type: string
          nullable: true
          default: 'null'
        active:
          description: 'Carte active (par ex : terminée ou non)'
          type: boolean
        share:
          description: "Publication de la carte ('atlas', 'public', 'private'). <br>\r\nSi une 'organization' est rempli, la valeur sera 'private' sauf si l'utilisateur connecté est owner"
          type: string
          default: private
        bbox:
          $ref: '#/components/schemas/Bbox'
        img_url:
          description: 'Url de l''image illustrant la carte'
          type: string
          nullable: true
          format: uri
        creator_id:
          description: 'Identifiant public du créateur (si la carte est dans une organisation)'
          type: string
      type: object
    Map_list:
      description: Carte
      properties:
        title:
          type: string
        title_url:
          description: 'Titre de la carte, adapté pour etre utilisé dans les url'
          type: string
        description:
          type: string
          nullable: true
        theme:
          type: string
          nullable: true
        theme_id:
          type: integer
          nullable: true
        organization_id:
          description: 'identifiant de l''organisation'
          type: string
        organization_name:
          description: 'Nom de l''organisation'
          type: string
        type:
          type: string
        premium:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        nb_view:
          type: integer
        img_url:
          type: string
          format: uri
          nullable: true
        share:
          type: string
        bbox:
          $ref: '#/components/schemas/Bbox'
        view_id:
          type: string
        view_url:
          description: 'lien vers la visualisation de la carte'
          type: string
        edit_id:
          description: 'si auteur de la carte'
          type: string
        author:
          type: string
      type: object
    Map_view:
      description: Carte
      type: object
      allOf:
        -
          properties:
            data_url:
              description: 'lien vers le contenu de la carte'
              type: string
              format: uri
            data_edit_url:
              description: 'lien vers l''édition du contenu de la carte, si auteur de la carte'
              type: string
              format: uri
            editor:
              description: 'utilisateur qui a modifié le contenu, renvoyé si auteur de la carte'
              type: string
            creator_id:
              description: 'identifiant de l''utilisateur qui a créé le contenu, renvoyé si auteur de la carte'
              type: string
        -
          $ref: '#/components/schemas/Map_list'
    Media:
      description: media
      properties:
        id:
          description: 'identifiant du media'
          type: integer
        name:
          description: 'nom de l''image originale'
          type: string
