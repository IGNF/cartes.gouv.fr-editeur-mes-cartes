          description: 'id de l''organisation à qui appartient le media'
          type: string
        organization:
          description: 'nom de l''organisation à qui appartient le media'
          type: string
        uploaded_at:
          description: 'date du chargement de l''image'
          type: string
          format: date-time
        size:
          description: 'Taille de l''image (en octet)'
          type: integer
        folder:
          description: 'Nom du fichier contenant le media'
          type: string
        valid:
          description: 'Validité de l''image'
          type: boolean
        view_url:
          description: 'Url de l''image'
          type: string
          format: uri
        thumb_url:
          description: 'Url de la vignette de l''image'
          type: string
          format: uri
      type: object
    Media_list:
      description: 'Liste de médias'
      properties:
        medias:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        count:
